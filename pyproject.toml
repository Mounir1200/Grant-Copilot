[project]
name = "grant-copilot"
version = "0.1.0"
description = "A Slack agent that helps nonprofits find, track, and apply to grants."
readme = "README.md"
authors = [
    { name = "Normiu", email = "115707908+Mounir1200@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "httpx>=0.28.1",
    "mcp>=1.28.1",
    "mistralai>=2.5.0",
    "python-dotenv>=1.2.2",
    "slack-bolt>=1.28.0",
]

[project.scripts]
grant-copilot = "grant_copilot.app:run"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
